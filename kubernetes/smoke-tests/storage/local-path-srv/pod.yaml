apiVersion: v1
kind: Pod
metadata:
  name: local-path-srv-smoke
  namespace: storage-smoke
spec:
  restartPolicy: Always
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 365d"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: local-path-srv-smoke
